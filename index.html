<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경주말 방언 사전</title>
    <style>
        :root { --point: #a33b3b; --bg: #fdfaf6; --text: #333; }
        
        /* 모바일 최적화: 전체 폭을 좁게 설정하여 글씨가 상대적으로 커 보이게 함 */
        body { 
            background: var(--bg); 
            margin: 0; 
            padding: 15px; 
            font-family: 'Malgun Gothic', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: var(--text);
            line-height: 1.5;
        }
        
        .container { 
            width: 100%; 
            max-width: 450px; /* 휴대폰 한 손 너비에 맞춤 */
        }
        
        /* 로고 섹션 크기 조정 */
        .logo-container { text-align: center; margin: 20px 0 30px; }
        .logo-svg { width: 80px; height: auto; fill: var(--point); margin-bottom: 5px; }
        .logo-text { font-size: 22px; font-weight: bold; color: var(--point); letter-spacing: -1px; }

        /* 검색창 영역: 입력창과 폰트 크기 확대 */
        .search-section { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; width: 100%; box-sizing: border-box; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; font-size: 1rem; }
        input { 
            width: 100%; 
            padding: 18px; /* 터치하기 쉽게 높임 */
            border: 2px solid #ddd; 
            border-radius: 12px; 
            font-size: 18px; /* 모바일에서 자동 줌 방지 및 가독성 확보 */
            box-sizing: border-box; 
            transition: 0.3s; 
        }
        input:focus { border-color: var(--point); outline: none; }

        /* 가나다순 탐색: 버튼을 큼직하게 배치 */
        .browse-section { background: #fff; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #eee; width: 100%; box-sizing: border-box;}
        .browse-title { font-size: 15px; font-weight: bold; color: #888; margin-bottom: 15px; text-align: center; }
        
        .nav-grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); /* 5열 배치로 버튼 크기 확보 */
            gap: 8px; 
            margin-bottom: 25px; 
        }
        .nav-btn { 
            aspect-ratio: 1/1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #f9f9f9; 
            border: 1px solid #eee; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 18px; 
            font-weight: bold;
        }

        /* 카테고리: 2열 배치로 텍스트 공간 확보 */
        .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .cat-btn { padding: 15px; background: #fff; border: 1.5px solid #eee; border-radius: 12px; cursor: pointer; text-align: center; font-size: 16px; }

        /* 검색 결과 목록 */
        #searchList { margin-bottom: 20px; display: none; background: #fff; border-radius: 12px; border: 1px solid #ddd; width: 100%; }
        .list-item { padding: 20px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 18px; }

        /* 상세 결과 카드: 텍스트 가독성 중심 */
        #resultView { width: 100%; display: none; margin-bottom: 40px; }
        .result-card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
        .word-title { font-size: 36px; font-weight: bold; color: var(--point); display: block; margin-bottom: 5px; }
        .pos-badge { font-size: 14px; background: #f0f0f0; padding: 4px 10px; border-radius: 6px; color: #666; }
        .def-area { font-size: 20px; line-height: 1.8; margin-top: 25px; border-top: 1px solid #eee; padding-top: 20px; }

        /* 하단 추천: 세로로 길게 배치 */
        .rec-section { width: 100%; margin-top: 20px; }
        .rec-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 40px; }
        .rec-card { background: white; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #eee; font-size: 18px; }

        .footer-info { border-top: 1px solid #ddd; padding: 25px 10px; color: #888; font-size: 14px; line-height: 1.7; word-break: keep-all; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <svg class="logo-svg" viewBox="0 0 100 100">
            <path d="M35 80 L65 80 M38 70 L62 70 M40 25 L60 25 L63 70 L37 70 Z" fill="none" stroke="currentColor" stroke-width="3"/>
            <rect x="47" y="40" width="6" height="8" fill="currentColor"/>
            <path d="M42 32 H58 M42 42 H58 M42 52 H58" stroke="currentColor" stroke-width="1"/>
        </svg>
        <div class="logo-text">경주말 방언 사전</div>
    </div>

    <div class="search-section">
        <div class="input-group">
            <label>🔍 경주말 표제어</label>
            <input type="text" id="diaSearch" placeholder="어휘 입력">
        </div>
        <div class="input-group">
            <label>📖 뜻풀이 키워드</label>
            <input type="text" id="stdSearch" placeholder="표준어 입력">
        </div>
    </div>

    <div class="browse-section">
        <div class="browse-title">가나다순 탐색</div>
        <div id="consonantNav" class="nav-grid"></div>

        <div class="browse-title">카테고리</div>
        <div class="cat-grid">
            <div class="cat-btn" onclick="searchCategory('음식')">🍱 음식</div>
            <div class="cat-btn" onclick="searchCategory('생활')">🏠 생활</div>
            <div class="cat-btn" onclick="searchCategory('감정')">😊 감정</div>
            <div class="cat-btn" onclick="searchCategory('욕설')">🤬 욕설</div>
        </div>
    </div>

    <div id="searchList">
        <div id="resCount" style="padding:15px; font-size:14px; background:#f8f8f8; color:#888; text-align:center;"></div>
        <div id="listItems"></div>
    </div>

    <div id="resultView">
        <div class="result-card">
            <span id="v-word" class="word-title"></span>
            <span id="v-pos" class="pos-badge"></span>
            <div id="v-def" class="def-area"></div>
        </div>
    </div>

    <div class="rec-section">
        <div style="font-weight:bold; color:#666; margin-bottom:15px; text-align:center;">📅 오늘의 추천어</div>
        <div class="rec-container" id="recommendList"></div>
        
        <div class="footer-info">
            <p><strong>[사전 안내]</strong> 본 서비스는 경주 지역 방언의 가치를 알리고 보존하기 위해 제작되었습니다.</p>
            <p><strong>[저작권]</strong> 데이터의 저작권은 편저자에게 있으며, 웹 소스는 비영리 목적으로 공개됩니다.</p>
        </div>
    </div>
</div>

<script>
    let dictData = [];
    const posMap = { 
        '󰃃': '명사', '󰂿': '동사', '󰃰': '형용사', '󰂴': '대명사', 
        '󰃦': '부사', '󰃥': '접두/접미사', '󰃆': '어미', '󰃲': '관형사', 
        '󰃳': '감탄사', '󰃲': '활용어미', '󰃓': '수사', '󰃫': '참고', '󰃩': '준말' 
    };

    const consonants = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

    function getInitialConsonant(str) {
        if (!str) return "";
        const code = str.charCodeAt(0) - 44032;
        if (code < 0 || code > 11171) return str[0];
        return consonants[Math.floor(code / 588)];
    }

    const nav = document.getElementById('consonantNav');
    ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'].forEach(c => {
        const btn = document.createElement('div');
        btn.className = 'nav-btn';
        btn.innerText = c;
        btn.onclick = () => searchByInitial(c);
        nav.appendChild(btn);
    });

    fetch('gyeongju_dict.json')
        .then(res => res.json())
        .then(data => {
            dictData = data;
            initRecommendations();
        });

    function searchByInitial(char) {
        const filtered = dictData.filter(item => {
            const target = item.word_pure || item.word;
            if (!target) return false;
            const initial = getInitialConsonant(target);
            if (char === 'ㄱ') return initial === 'ㄱ' || initial === 'ㄲ';
            if (char === 'ㄷ') return initial === 'ㄷ' || initial === 'ㄸ';
            if (char === 'ㅂ') return initial === 'ㅂ' || initial === 'ㅃ';
            if (char === 'ㅅ') return initial === 'ㅅ' || initial === 'ㅆ';
            if (char === 'ㅈ') return initial === 'ㅈ' || initial === 'ㅉ';
            return initial === char;
        });
        displayList(filtered);
    }

    function searchCategory(cat) {
        const filtered = dictData.filter(item => item.definition && item.definition.includes(cat));
        displayList(filtered);
    }

    function displayDetail(item) {
        document.getElementById('resultView').style.display = 'block';
        document.getElementById('v-word').innerText = item.word || item.word_pure;
        const posText = posMap[item.pos_symbol] || item.pos_symbol || "";
        const pBadge = document.getElementById('v-pos');
        pBadge.innerText = posText;
        pBadge.style.display = posText ? 'inline-block' : 'none';
        document.getElementById('v-def').innerHTML = item.definition;
        window.scrollTo({ top: document.getElementById('resultView').offsetTop - 20, behavior: 'smooth' });
    }

    function displayList(items) {
        const searchList = document.getElementById('searchList');
        searchList.style.display = 'block';
        document.getElementById('resultView').style.display = 'none';
        document.getElementById('resCount').innerText = `총 ${items.length}개의 단어가 있습니다.`;
        const list = document.getElementById('listItems');
        list.innerHTML = '';
        items.slice(0, 50).forEach(item => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `<strong>${item.word}</strong>`;
            div.onclick = () => { displayDetail(item); searchList.style.display = 'none'; };
            list.appendChild(div);
        });
    }

    function initRecommendations() {
        const container = document.getElementById('recommendList');
        // 요청하신 대로 samples를 비우고 바로 랜덤 로직 가동
        const samples = []; 
        let recs = dictData.filter(i => samples.includes(i.word_pure)).slice(0, 3);
        if(recs.length < 3) recs = [...dictData].sort(() => 0.5 - Math.random()).slice(0, 3);

        recs.forEach(item => {
            const div = document.createElement('div');
            div.className = 'rec-card';
            div.innerHTML = `<div style="color:var(--point); font-weight:bold;">${item.word}</div>
                             <div style="font-size:14px; color:#999; margin-top:5px;">${item.definition.substring(0, 20)}...</div>`;
            div.onclick = () => displayDetail(item);
            container.appendChild(div);
        });
    }

    document.getElementById('diaSearch').addEventListener('input', (e) => {
        const val = e.target.value.trim();
        if(val.length >= 1) {
            const filtered = dictData.filter(i => (i.word_pure && i.word_pure.includes(val)) || (i.word && i.word.includes(val)));
            displayList(filtered);
        }
    });

    document.getElementById('stdSearch').addEventListener('input', (e) => {
        const val = e.target.value.trim();
        if(val.length >= 1) {
            const filtered = dictData.filter(i => i.definition && i.definition.includes(val));
            displayList(filtered);
        }
    });
</script>

</body>
</html>
