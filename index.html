        // TTS 버튼 로딩 및 재생 상태 UI 헬퍼 (상단 간결 토스트: "음성 생성중" / "음성 재생중")
        let ttsToastTimer = null;
        function setTTSLoadingState(targetBtn, isLoading, isPlaying = false) {
            const statusBadge = document.getElementById('tts-status');
            const toast = document.getElementById('tts-toast');
            const toastText = document.getElementById('tts-toast-text');
            const toastSpinner = document.getElementById('tts-toast-spinner');

            if (statusBadge) statusBadge.style.display = 'none';

            if (isLoading) {
                if (targetBtn) {
                    targetBtn.classList.add('tts-loading');
                    targetBtn.classList.remove('tts-playing');
                }
                if (toast && toastText) {
                    clearTimeout(ttsToastTimer);
                    toast.className = 'tts-toast show';
                    if (toastSpinner) toastSpinner.style.display = 'block';
                    toastText.innerText = '🎙️ 음성 생성중';
                }
            } else if (isPlaying) {
                if (targetBtn) {
                    targetBtn.classList.remove('tts-loading');
                    targetBtn.classList.add('tts-playing');
                }
                if (toast && toastText) {
                    clearTimeout(ttsToastTimer);
                    toast.className = 'tts-toast show playing';
                    if (toastSpinner) toastSpinner.style.display = 'none';
                    toastText.innerText = '🔊 음성 재생중';
                }
            } else {
                if (targetBtn) {
                    targetBtn.classList.remove('tts-loading');
                    targetBtn.classList.remove('tts-playing');
                }
                if (toast) {
                    clearTimeout(ttsToastTimer);
                    ttsToastTimer = setTimeout(() => {
                        toast.classList.remove('show');
                    }, 400);
                }
            }
        }

        // 경상도 방언 발음 텍스트를 Edge TTS 전용 SSML prosody 태그로 변환하는 함수
        // (강세 음절에 <prosody pitch="+XXHz">를 적용하여 억양을 매우 강하고 뚜렷하게 발음)
        function convertDialectToEdgeSSML(rawText, pitchHz = 35) {
            if (!rawText) return "";
            let text = rawText.trim();
            if (text.startsWith('[') && text.endsWith(']')) {
                text = text.slice(1, -1).trim();
            }
            while (/\[[^\]]*\]/.test(text)) {
                text = text.replace(/\[[^\]]*\]/g, '');
            }
            text = text.replace(/\{([^/>-]+)[/>-][^}]+\}/g, '$1');
            text = text.replace(/<[^>]+>/g, '');

            const pVal = Math.abs(parseInt(pitchHz) || 35);
            const pStr = `+${pVal}Hz`;

            // 복수 발음(/) 분리 처리
            const parts = text.split('/');
            const processed = parts.map(part => {
                let p = part.trim();
                // 한글 음절에 강세(' 또는 ′)가 있는 경우: prosody pitch 태그 부여
                p = p.replace(/([가-힣])['′]/g, (m, char) => {
                    return `<prosody pitch="${pStr}">${char}</prosody>`;
                });
                p = p.replace(/['′]/g, '').trim();
                return p;
            });

            return processed.join(', ').replace(/\?+/g, '').replace(/[!]+/g, '').replace(/\.+/g, '').trim();
        }

        // Microsoft Edge TTS (Hugging Face Spaces 연동) 호출 및 재생 함수
        async function speakEdgeTTS(rawText, ev = null) {
            if (!rawText) return;

            // 클릭된 스피커 버튼 요소 식별
            let targetBtn = null;
            if (ev) {
                targetBtn = ev.currentTarget || (ev.target ? ev.target.closest('.speaker-btn') : null);
            }
            if (!targetBtn) {
                targetBtn = document.querySelector('.speaker-btn-edge');
            }

            // 1. 기존 오디오 및 발화 모두 정지
            if (currentEdgeAudio) { currentEdgeAudio.pause(); currentEdgeAudio = null; }
            if (currentHFAudio) { currentHFAudio.pause(); currentHFAudio = null; }
            if (currentCloudAudio) { currentCloudAudio.pause(); currentCloudAudio = null; }
            if (currentGeminiAudio) { currentGeminiAudio.pause(); currentGeminiAudio = null; }
            if (window.speechSynthesis) { window.speechSynthesis.cancel(); }

            // 0. 사전 생성된 고음질 MP3 파일이 있으면 즉시 재생
            try {
                const map = await loadAudioMap();
                const key = rawText.trim();
                const mappedPath = map[key] || map[key.replace(/'/g, "\\'")] || map[`[${key}]`];
                if (mappedPath) {
                    console.log("[Edge TTS] 사전 생성된 MP3 파일 즉시 재생:", mappedPath);
                    currentEdgeAudio = new Audio(mappedPath);
                    setTTSLoadingState(targetBtn, false, true);
                    currentEdgeAudio.onended = () => setTTSLoadingState(targetBtn, false, false);
                    currentEdgeAudio.onerror = () => setTTSLoadingState(targetBtn, false, false);
                    await currentEdgeAudio.play();
                    return;
                }
            } catch (preErr) {
                console.warn("[Edge TTS] 사전 생성 오디오 확인 중 예외:", preErr);
            }

            const voiceChoice = localStorage.getItem('edge_voice_choice') || "남성 (InJoon)";
            const finalPitch = parseInt(localStorage.getItem('edge_tts_pitch') || "35"); // 강세와 일반 음의 피치 차이(Hz)
            const rateVal = parseInt(localStorage.getItem('edge_tts_rate') || "0");

            // 2. 텍스트 정제 및 SSML prosody 태그 변환 (음절 단위 강력한 억양 적용)
            let edgeText = convertDialectToEdgeSSML(rawText, finalPitch);
            if (!edgeText) return;

            // [핵심 기능 1] 방금 생성한 음성 임시 저장(캐시) 확인 -> 웹 요청 없이 즉시 재생!
            const cacheKey = `${edgeText}_${voiceChoice}_${finalPitch}_${rateVal}`;
            if (edgeAudioCache.has(cacheKey)) {
                console.log("[Edge TTS Cache] 임시 저장된 오디오 즉시 재생:", cacheKey);
                const cachedUrl = edgeAudioCache.get(cacheKey);
                currentEdgeAudio = new Audio(cachedUrl);
                setTTSLoadingState(targetBtn, false, true); // "🔊 음성 재생중"
                currentEdgeAudio.onended = () => setTTSLoadingState(targetBtn, false, false);
                currentEdgeAudio.onerror = () => setTTSLoadingState(targetBtn, false, false);
                try {
                    await currentEdgeAudio.play();
                    return;
                } catch (playErr) {
                    console.warn("[Edge TTS Cache] 재생 실패로 새 생성 시도:", playErr);
                }
            }

            // 3. Hugging Face Spaces 주소 확인
            let spaceEndpoint = localStorage.getItem('hf_edge_tts_endpoint');
            if (!spaceEndpoint || !spaceEndpoint.trim()) {
                spaceEndpoint = "bsgim5/edge-tts";
                localStorage.setItem('hf_edge_tts_endpoint', spaceEndpoint);
            }

            // 4. 주소 정규화 (Space ID -> Direct URL 변환)
            let cleanEndpoint = spaceEndpoint.trim().replace(/\/+$/, '');
            const hfSpaceMatch = cleanEndpoint.match(/huggingface\.co\/spaces\/([^/]+)\/([^/?#]+)/);
            if (hfSpaceMatch) {
                cleanEndpoint = `${hfSpaceMatch[1]}/${hfSpaceMatch[2]}`;
            }

            let baseHost = cleanEndpoint;
            if (!baseHost.startsWith('http://') && !baseHost.startsWith('https://')) {
                const parts = cleanEndpoint.split('/');
                if (parts.length === 2) {
                    const user = parts[0].toLowerCase().replace(/[^a-z0-9]/g, '');
                    const space = parts[1].toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
                    baseHost = `https://${user}-${space}.hf.space`;
                } else {
                    const cleanId = cleanEndpoint.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
                    baseHost = `https://${cleanId}.hf.space`;
                }
            }
            baseHost = baseHost.replace(/\/+$/, '');

            console.log(`[Edge HF TTS] 텍스트: "${edgeText}", 보이스: ${voiceChoice}, 강세 피치차: +${finalPitch}Hz, 속도: ${rateVal}%, 주소: ${cleanEndpoint}`);

            // 로딩 안내 가동 ("🎙️ 음성 생성중")
            setTTSLoadingState(targetBtn, true, false);

            try {
                let audioUrl = null;

                // [방법 0: 초고속 직통 REST API 호출 (/tts 및 /api/tts)]
                // Gradio 큐나 복잡한 SSE 파싱 없이 0.1초 만에 MP3 Blob을 다이렉트로 수신!
                try {
                    const directEndpoints = [`${baseHost}/tts`, `${baseHost}/api/tts`];
                    for (const ep of directEndpoints) {
                        try {
                            console.log("[Edge HF TTS] 직통 REST 호출 시도:", ep);
                            const directResp = await fetch(ep, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ text: edgeText, voice: voiceChoice, rate: rateVal, pitch: finalPitch })
                            });
                            if (directResp.ok) {
                                const blob = await directResp.blob();
                                if (blob && blob.size > 0) {
                                    audioUrl = URL.createObjectURL(blob);
                                    console.log("[Edge HF TTS] 직통 REST 성공! Blob 크기:", blob.size);
                                    break;
                                }
                            }
                        } catch (deErr) {
                            // 다음 엔드포인트 시도
                        }
                    }
                } catch (dErr) {}

                // 방법 1: @gradio/client 연결 (Gradio 5/4 클라이언트 Fallback)
                if (!audioUrl) {
                    try {
                        const { Client } = await import("https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js");
                        console.log("[Edge HF TTS] Client.connect 시도:", cleanEndpoint);
                        const app = await Client.connect(cleanEndpoint);

                        const endpoints = ["/generate_speech", "/predict", 0];
                        for (const ep of endpoints) {
                            try {
                                console.log(`[Edge HF TTS] 엔드포인트(${ep}) 호출 중...`);
                                const result = await app.predict(ep, [ edgeText, voiceChoice, rateVal, finalPitch ]);
                                if (result && result.data && result.data.length > 0) {
                                    const item = result.data[0];
                                    let raw = (typeof item === 'object' && item !== null) ? (item.url || item.path) : (typeof item === 'string' ? item : null);
                                    if (raw) {
                                        audioUrl = raw;
                                        console.log(`[Edge HF TTS] 엔드포인트(${ep}) 성공! 수신 URL:`, audioUrl);
                                        break;
                                    }
                                }
                            } catch (epErr) {
                                console.warn(`[Edge HF TTS] 엔드포인트(${ep}) 실패:`, epErr.message);
                            }
                        }
                    } catch (gradioErr) {
                        console.warn("[Edge HF TTS] @gradio/client 연결 실패 -> REST 직접 호출로 전환:", gradioErr.message);
                    }
                }

                // 방법 2: REST API 직접 호출 (Gradio 5 SSE 및 REST 호환)
                if (!audioUrl) {
                    const restEndpoints = [
                        `${baseHost}/gradio_api/call/generate_speech`,
                        `${baseHost}/gradio_api/call/predict`,
                        `${baseHost}/api/generate_speech`,
                        `${baseHost}/api/predict`,
                        `${baseHost}/predict`
                    ];

                    for (const ep of restEndpoints) {
                        try {
                            console.log("[Edge HF TTS] REST 호출 시도:", ep);
                            const res = await fetch(ep, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ data: [ edgeText, voiceChoice, rateVal, finalPitch ] })
                            });
                            if (res.ok) {
                                const respData = await res.json();
                                if (respData.event_id) {
                                    const eventRes = await fetch(`${ep}/${respData.event_id}`);
                                    const eventText = await eventRes.text();
                                    const lines = eventText.split('\n');
                                    for (const l of lines) {
                                        if (l.startsWith('data:')) {
                                            try {
                                                const d = JSON.parse(l.slice(5).trim());
                                                if (Array.isArray(d) && d[0]) {
                                                    const it = d[0];
                                                    audioUrl = (typeof it === 'object' && it !== null) ? (it.url || it.path) : it;
                                                    if (audioUrl) break;
                                                }
                                            } catch (je) {}
                                        }
                                    }
                                } else if (respData.data && respData.data[0]) {
                                    const it = respData.data[0];
                                    audioUrl = (typeof it === 'object' && it !== null) ? (it.url || it.path) : it;
                                }
                                if (audioUrl) break;
                            }
                        } catch (restErr) {
                            // 다음 엔드포인트 계속
                        }
                    }
                }

                // 상대 경로인 경우 baseHost 붙여 절대 URL 완성
                if (audioUrl && typeof audioUrl === 'string') {
                    if (!audioUrl.startsWith('http://') && !audioUrl.startsWith('https://') && !audioUrl.startsWith('blob:')) {
                        audioUrl = baseHost + (audioUrl.startsWith('/') ? '' : '/') + audioUrl;
                    }
                }

                if (audioUrl) {
                    console.log("[Edge HF TTS] 최종 오디오 재생 URL:", audioUrl);
                    // [핵심 기능 1] 방금 생성된 오디오를 임시 캐시에 저장
                    edgeAudioCache.set(cacheKey, audioUrl);

                    currentEdgeAudio = new Audio(audioUrl);
                    setTTSLoadingState(targetBtn, false, true); // "🔊 음성 재생중"
                    currentEdgeAudio.onended = () => setTTSLoadingState(targetBtn, false, false);
                    currentEdgeAudio.onerror = () => setTTSLoadingState(targetBtn, false, false);
                    await currentEdgeAudio.play();
                    return;
                } else {
                    throw new Error("Hugging Face Space에서 오디오를 수신하지 못했습니다.");
                }
            } catch (err) {
                console.warn("[Edge HF TTS Error]:", err.message);

                // 방법 3: 로컬 프록시(127.0.0.1:5050) Fallback 시도
                try {
                    const localResp = await fetch('http://127.0.0.1:5050/tts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: edgeText, voice: 'ko-KR-InJoonNeural', pitch: finalPitch, rate: rateVal })
                    });
                    if (localResp.ok) {
                        const blob = await localResp.blob();
                        if (blob.size > 0) {
                            const blobUrl = URL.createObjectURL(blob);
                            // [핵심 기능 1] 로컬 생성 오디오도 캐시에 저장
                            edgeAudioCache.set(cacheKey, blobUrl);

                            currentEdgeAudio = new Audio(blobUrl);
                            setTTSLoadingState(targetBtn, false, true); // "🔊 음성 재생중"
                            currentEdgeAudio.onended = () => setTTSLoadingState(targetBtn, false, false);
                            currentEdgeAudio.onerror = () => setTTSLoadingState(targetBtn, false, false);
                            await currentEdgeAudio.play();
                            console.log("[Edge TTS] 로컬 프록시로 대체 재생 성공!");
                            return;
                        }
                    }
                } catch (localErr) {}

                setTTSLoadingState(targetBtn, false, false);
                alert(`[3번 Microsoft Edge TTS 오류]\n${err.message}\n\n• 등록된 Space 주소: ${spaceEndpoint}\n• 3번 스피커를 우클릭하여 Hugging Face Space 주소를 다시 설정할 수 있습니다.\n• Space가 'Public(공개)' 상태이고 'Running' 중인지 확인해주세요.`);
            }
        }

        // 표제어 전용 Microsoft Edge TTS 재생
        function speakPronunciationEdge(ev = null) {
            if (!currentItem || !currentItem.pronunciation) return;
            speakEdgeTTS(currentItem.pronunciation, ev);
        }

        // 1번 회색 스피커: 기본 TTS를 사용하고 마지막 음절 강세가 분리된 정제 텍스트로 자연스럽게 발화
        function speakPronunciation() {
            if (!currentItem || !currentItem.pronunciation || !window.speechSynthesis) return;
            window.speechSynthesis.cancel();

            const text = prepareDialectSpeechText(currentItem.pronunciation);
            if (!text) return;

            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'ko-KR';
            u.rate = 0.92;
            window.speechSynthesis.speak(u);
        }


        /* --- [6. UI 렌더링: 리스트 및 상세화면] --- */
        function toggleExample() { const content = document.getElementById('v-ex-content'), toggleBtn = document.querySelector('.ex-toggle'), isHidden = content.style.display === 'none' || content.style.display === ''; content.style.display = isHidden ? 'block' : 'none'; toggleBtn.classList.toggle('active', isHidden); }
        /* --- 통합 토글 함수 --- */
        function toggleCombined() {
            const content = document.getElementById('v-combined-content');
            const toggleBtn = document.querySelector('.ex-toggle');
            const isHidden = content.style.display === 'none' || content.style.display === '';
            content.style.display = isHidden ? 'block' : 'none';
            toggleBtn.classList.toggle('active', isHidden);
        }


        function displayDetail(item) {
            currentItem = item;
            document.getElementById('searchList').style.display = 'none';
            document.getElementById('resultView').style.display = 'block';
            document.getElementById('v-word').innerHTML = formatWordSuperscript(item.word || item.word_pure);

            // 조합 단어 표시 (예: {우-오} -> 꿈꼬다, 꿈꾸다)
            const expDiv = document.getElementById('v-expands');
            if (expDiv) {
                if (item.expanded_words && item.expanded_words.length > 0 && (item.word.includes('{') || (item.word_pure && item.word_pure.includes('{')))) {
                    expDiv.innerText = `조합 표기: ${item.expanded_words.join(', ')}`;
                    expDiv.style.display = 'block';
                } else {
                    expDiv.style.display = 'none';
                }
            }

            // 상세 보기 진입 시 추천 단어 목록 및 섹션 숨기기
            const recSec = document.getElementById('recSection');
            if (recSec) recSec.style.display = 'none';
            const recList = document.getElementById('recommendList');
            if (recList) recList.style.display = 'none';

            // 1. item.pos_symbol이 있을 경우, 각 글자를 순회하며 한글 품사로 변환합니다.
            const posText = posMap[item.pos_symbol] || item.pos_symbol || "", pBadge = document.getElementById('v-pos'); pBadge.innerText = posText; pBadge.style.display = posText ? 'inline-block' : 'none';

            if (item.pronunciation) { document.getElementById('v-pron').innerText = `[${item.pronunciation}]`; document.getElementById('v-pron-row').style.display = 'flex'; } else { document.getElementById('v-pron-row').style.display = 'none'; }
            document.getElementById('v-def').innerHTML = createAutoLinks(item.definition, item.word_pure);
            document.getElementById('reportMail').href = `mailto:bsgim5@gmail.com?subject=${encodeURIComponent('[경주말사전 오류제보] ' + item.word_pure)}&body=${encodeURIComponent('표제어: ' + item.word_pure + '\n뜻풀이: ' + item.definition + '\n\n내용: 이곳에 수정 내용을 적어주세요.')}`;

            const combinedBox = document.getElementById('v-combined-box');
            const combinedContent = document.getElementById('v-combined-content');

            let htmlContent = "";

            // 2. 예문(Examples) 추가
            if (item.examples && item.examples.length > 0) {
                htmlContent += item.examples.map(ex => `
                    <div class="ex-item">
                         ${processDialectTTS(ex.dialect)}
                        <span class="ex-std">표준어: ${ex.standard}</span>
                    </div>
                `).join('');
            }
            // 1. 구절(Idioms) 추가
            if (item.idioms && item.idioms.length > 0) {
                htmlContent += item.idioms.map(idm => {
                    let text = "";
                    if (typeof idm === 'string') {
                        text = idm;
                    } else if (idm.full) {
                        text = idm.full;
                    } else if (idm.phrase) {
                        text = idm.phrase;
                        if (idm.standard) text += ` <${idm.standard}>`;
                        if (idm.meaning && idm.meaning !== idm.standard) text += ` ${idm.meaning}`;
                    } else {
                        text = idm.meaning || "";
                    }
                    return `
                    <div class="ex-item" style="border-left: 3px solid #7ea1c4; background: #f4f7fa; line-height: 1.6;">
                        <div style="font-size:15px; color:#333;">${processIdiomTTS(text)}</div>
                    </div>
                `;
                }).join('');
            }

            // 3. 데이터가 하나라도 있으면 출력, 없으면 숨김
            if (htmlContent) {
                combinedBox.style.display = 'block';
                combinedContent.innerHTML = htmlContent;
                combinedContent.style.display = 'none'; // 초기 상태는 닫힘
                document.querySelector('.ex-toggle').classList.remove('active');
            } else {
                combinedBox.style.display = 'none';
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function displayList(items, page = 1) {
            filteredData = items; currentPage = page; document.getElementById('searchList').style.display = 'block'; document.getElementById('resultView').style.display = 'none'; document.getElementById('resCount').innerText = `${items.length}건 (현재 ${page}페이지)`;
            const list = document.getElementById('listItems'); list.innerHTML = '';
            items.slice((page - 1) * itemsPerPage, page * itemsPerPage).forEach(item => {
                const div = document.createElement('div');
                div.className = 'list-item';
                let expandHint = '';
                if (item.expanded_words && item.expanded_words.length > 0 && (item.word.includes('{') || (item.word_pure && item.word_pure.includes('{')))) {
                    expandHint = `<span style="font-size:12px; color:var(--point); font-weight:normal; margin-left:6px;">(${item.expanded_words.join(', ')})</span>`;
                }
                div.innerHTML = `<b>${formatWordSuperscript(item.word)}</b>${expandHint}<span class="brief-text">${item.definition.replace(/<[^>]*>?/gm, '').substring(0, 20)}...</span>`;
                div.onclick = () => displayDetail(item);
                list.appendChild(div);
            });
            renderPagination(items.length);
        }
        /* --- [7. 내비게이션 및 추천 기능] --- */
        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / itemsPerPage); if (totalPages <= 1) return;
            const nav = document.createElement('div'); nav.className = 'pagination';
            for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, Math.max(1, currentPage - 2) + 4); i++) {
                const btn = document.createElement('button'); btn.className = `page-btn ${i === currentPage ? 'active' : ''}`; btn.innerText = i; btn.onclick = () => { displayList(filteredData, i); window.scrollTo(0, 0); }; nav.appendChild(btn);
            }
            document.getElementById('listItems').appendChild(nav);
        }
        /* --- [추가] 상세 보기에서 목록으로 돌아가는 기능 --- */
        function goBackToList() {
            // 상세 보기 화면 숨기기
            document.getElementById('resultView').style.display = 'none';
            // 검색 결과 리스트 화면 다시 보이기
            document.getElementById('searchList').style.display = 'block';
            // 추천 단어 섹션 및 목록 다시 보이기
            const recSec = document.getElementById('recSection');
            if (recSec) recSec.style.display = 'block';
            const recList = document.getElementById('recommendList');
            if (recList) recList.style.display = 'flex';
        }


        function getInitialConsonant(str) { if (!str) return ""; const code = str.charCodeAt(0) - 44032; return (code < 0 || code > 11171) ? str[0] : consonants[Math.floor(code / 588)]; }
        function searchByInitial(char) {
            const sets = { 'ㄱ': ['ㄱ', 'ㄲ'], 'ㄷ': ['ㄷ', 'ㄸ'], 'ㅂ': ['ㅂ', 'ㅃ'], 'ㅅ': ['ㅅ', 'ㅆ'], 'ㅈ': ['ㅈ', 'ㅉ'] };
            displayList(dictData.filter(item => {
                const words = [item.word_pure || item.word || "", ...(item.expanded_words || [])];
                return words.some(w => {
                    const initial = getInitialConsonant(w);
                    return sets[char] ? sets[char].includes(initial) : initial === char;
                });
            }));
        }

        function searchByPosGroup(symbols) { let filtered = dictData.filter(item => symbols.includes(item.pos_symbol)); filtered.sort(() => Math.random() - 0.5); displayList(filtered); }

        function searchByPosOther() { let filtered = dictData.filter(item => item.pos_symbol && !['󰃃', '󰂽', '󰃓', '󰂿', '󰃰'].includes(item.pos_symbol)); filtered.sort(() => Math.random() - 0.5); displayList(filtered); }

        // 첫 화면 랜덤 단어 3개 로드 / 다른 단어로 다시 로드
        function initRecommendations() {
            const container = document.getElementById('recommendList');
            if (!container || !dictData || dictData.length === 0) return;
            container.innerHTML = '';
            const randomList = [...dictData].sort(() => 0.5 - Math.random()).slice(0, 3);
            randomList.forEach(item => {
                const div = document.createElement('div');
                div.className = 'rec-card';
                div.innerHTML = `<b>${formatWordSuperscript(item.word)}</b> <span style="font-size:12px; color:#999;">${item.definition.substring(0, 15)}...</span>`;
                div.onclick = () => displayDetail(item);
                container.appendChild(div);
            });
        }
        /* --- [8. 이벤트 리스너 및 실행] --- */
        document.getElementById('diaSearch').addEventListener('input', (e) => debounceSearch('dia', e.target.value.trim()));
        document.getElementById('stdSearch').addEventListener('input', (e) => debounceSearch('std', e.target.value.trim()));
        ['ㄱ', 'ㄴ', 'ㄷ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅅ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'].forEach(c => { const btn = document.createElement('div'); btn.className = 'nav-btn'; btn.innerText = c; btn.onclick = () => searchByInitial(c); document.getElementById('consonantNav').appendChild(btn); });
        init(); // 앱 시작

        /* --- [9. 핸드폰 뒤로 가기 버튼 방어 및 종료 확인] --- */
        let isExitingApp = false;
        try {
            window.history.pushState({ page: 'home' }, '', '');
        } catch (e) {}

        window.addEventListener('popstate', (e) => {
            if (isExitingApp) return;

            const resultView = document.getElementById('resultView');
            // 상세 화면이 열려있는 경우 목록으로 돌아갈지 질문
            if (resultView && resultView.style.display !== 'none') {
                const stay = confirm("경주어 사전을 계속 이용하시겠습니까?\n('확인'을 누르면 목록 화면으로 돌아갑니다)");
                if (stay) {
                    goBackToList();
                    window.history.pushState({ page: 'home' }, '', '');
                    return;
                } else {
                    isExitingApp = true;
                    window.history.back();
                    return;
                }
            }

            // 첫 화면/목록 화면에서 뒤로가기 누른 경우
            const stay = confirm("경주어 사전을 계속 이용하시겠습니까?");
            if (stay) {
                window.history.pushState({ page: 'home' }, '', '');
            } else {
                isExitingApp = true;
                window.history.back();
            }
        });
    </script>
</body>

</html>
