<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경주말 방언 사전</title>
    <style>
        :root { --point: #a33b3b; --bg: #fdfaf6; }
        body { background: var(--bg); margin: 0; padding: 20px; font-family: 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; align-items: center; }
        
        .container { width: 100%; max-width: 800px; }
        
        /* 검색창 섹션 */
        .search-section { background: white; padding: 25px; border-radius: 15px; shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #444; }
        input { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: var(--point); outline: none; box-shadow: 0 0 8px rgba(163,59,59,0.2); }

        /* 오늘의 추천어 섹션 */
        .recommend-section { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .rec-card { background: #fff; padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #eee; transition: 0.2s; }
        .rec-card:hover { transform: translateY(-3px); border-color: var(--point); }
        .rec-tag { font-size: 11px; color: white; background: var(--point); padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 5px; }

        /* 결과 표시 섹션 (Flexible) */
        #resultView { width: 100%; display: none; } /* 결과가 있을 때만 표시 */
        .result-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); min-height: 100px; height: auto; overflow: hidden; }
        .word-header { border-bottom: 2px solid var(--point); padding-bottom: 15px; margin-bottom: 20px; }
        .word-title { font-size: 32px; font-weight: bold; color: var(--point); }
        .word-pron { font-size: 18px; color: #666; margin-left: 10px; }
        
        .def-area { font-size: 18px; line-height: 1.7; margin-bottom: 25px; white-space: pre-wrap; }
        .ex-area { background: #f9f9f9; padding: 20px; border-radius: 10px; }
        .ex-item { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .ex-item:last-child { border: none; }
        .ex-dia { font-weight: bold; color: #333; display: block; margin-bottom: 5px; }
        .ex-std { color: #666; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <div class="search-section">
        <div class="input-group">
            <label>🔍 경주말 표제어 검색</label>
            <input type="text" id="diaSearch" placeholder="경주말을 입력하세요 (예: 가이)">
        </div>
        <div class="input-group">
            <label>📖 표준어/뜻풀이 검색</label>
            <input type="text" id="stdSearch" placeholder="표준어 의미로 찾기 (예: 강아지)">
        </div>
    </div>

    <div class="recommend-section" id="recommendList">
        </div>

    <div id="resultView">
        <div class="result-card">
            <div class="word-header">
                <span class="word-title" id="v-word">-</span>
                <span class="word-pron" id="v-pron">[-]</span>
                <span id="v-pos" style="font-size:14px; color:#888;"></span>
            </div>
            <div class="def-area" id="v-def">
                뜻풀이가 여기에 나타납니다.
            </div>
            <div class="ex-area" id="v-ex">
                <strong>예문</strong>
                <div id="ex-list"></div>
            </div>
        </div>
    </div>
</div>

<script>
    let dictData = [];

    // 데이터 로드 (4만 건의 경우 로딩 시간이 걸릴 수 있음)
    fetch('gyeongju_dict.json')
        .then(res => res.json())
        .then(data => {
            dictData = data;
            initRecommendations();
        })
        .catch(err => console.error("데이터를 불러오지 못했습니다. 파일명을 확인하세요."));

    const vView = document.getElementById('resultView');

    function updateDisplay(item) {
        if(!item) return;
        vView.style.display = 'block';
        document.getElementById('v-word').innerText = item.word;
        document.getElementById('v-pron').innerText = `[${item.pronunciation}]`;
        document.getElementById('v-pos').innerText = item.pos_symbol;
        document.getElementById('v-def').innerText = item.definition;

        const exList = document.getElementById('ex-list');
        exList.innerHTML = '';
        item.examples.forEach(ex => {
            exList.innerHTML += `
                <div class="ex-item">
                    <span class="ex-dia">¶ ${ex.dialect}</span>
                    <span class="ex-std">< ${ex.standard} ></span>
                </div>
            `;
        });
        
        // 검색 후 결과창으로 부드럽게 스크롤
        vView.scrollIntoView({ behavior: 'smooth' });
    }

    // 경주말 검색 (숫자 제외 검색 지원)
    document.getElementById('diaSearch').addEventListener('input', (e) => {
        const val = e.target.value.trim();
        if(val.length < 1) { vView.style.display = 'none'; return; }
        const found = dictData.find(i => i.word_pure === val || i.word === val);
        if(found) updateDisplay(found);
    });

    // 표준어 검색
    document.getElementById('stdSearch').addEventListener('input', (e) => {
        const val = e.target.value.trim();
        if(val.length < 1) { vView.style.display = 'none'; return; }
        const found = dictData.find(i => i.definition.includes(val));
        if(found) updateDisplay(found);
    });

    // 추천 단어 초기화
    function initRecommendations() {
        const list = document.getElementById('recommendList');
        // 임의로 3개 추출
        const shuffled = [...dictData].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, 3);

        selected.forEach(item => {
            const div = document.createElement('div');
            div.className = 'rec-card';
            div.innerHTML = `<span class="rec-tag">추천</span><br><strong>${item.word_pure}</strong>`;
            div.onclick = () => updateDisplay(item);
            list.appendChild(div);
        });
    }
</script>

</body>
</html>
