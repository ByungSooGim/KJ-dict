<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경주말 방언 사전</title>
    <style>
        :root { --point: #a33b3b; --bg: #fdfaf6; --text: #333; }
        body { background: var(--bg); margin: 0; padding: 20px; font-family: 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; align-items: center; color: var(--text); }
        .container { width: 100%; max-width: 800px; }
        
        /* 로딩 레이어 */
        #loadingOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.95); 
                          display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--point); border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 검색 섹션 */
        .search-section { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; width: 100%; box-sizing: border-box; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; font-size: 0.9em; }
        input { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: var(--point); outline: none; box-shadow: 0 0 8px rgba(163,59,59,0.15); }

        /* 검색 결과 목록 */
        #searchList { margin-bottom: 20px; display: none; background: #fff; border-radius: 12px; border: 1px solid #ddd; overflow: hidden; width: 100%; }
        .list-item { padding: 15px 20px; border-bottom: 1px solid #eee; cursor: pointer; transition: 0.2s; }
        .list-item:hover { background: #fff5f5; color: var(--point); }

        /* 상세 결과 카드 */
        #resultView { width: 100%; display: none; margin-bottom: 30px; }
        .result-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
        .word-header { border-bottom: 2px solid var(--point); padding-bottom: 15px; margin-bottom: 20px; display: flex; align-items: baseline; flex-wrap: wrap; }
        
        /* 표제어 스타일링 */
        .word-title { font-size: 32px; font-weight: bold; color: var(--point); }
        .word-title sup { font-size: 0.6em; vertical-align: super; margin-left: 2px; }
        .word-title .hanja { font-size: 0.7em; color: #888; font-weight: normal; margin-left: 8px; }
        
        .word-pron { font-size: 18px; color: #666; margin-left: 10px; }
        .pos-badge { font-size: 14px; background: #eee; padding: 2px 8px; border-radius: 4px; margin-left: 10px; color: #666; }

        .def-area { font-size: 18px; line-height: 1.8; margin-bottom: 25px; white-space: pre-wrap; }
        .dict-link { color: var(--point); text-decoration: underline; cursor: pointer; font-weight: bold; }
        .dict-link sup { font-size: 0.6em; vertical-align: super; }

        /* 하단 추천 */
        .rec-section { margin-top: 20px; width: 100%; }
        .rec-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .rec-card { background: white; padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #eee; }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <div id="loadingText">사전 데이터를 불러오는 중입니다...</div>
</div>

<div class="container">
    <div class="search-section">
        <div class="input-group">
            <label>🔍 경주말 표제어 검색</label>
            <input type="text" id="diaSearch" placeholder="표제어 입력">
        </div>
        <div class="input-group">
            <label>📖 뜻풀이 키워드 검색</label>
            <input type="text" id="stdSearch" placeholder="표준어 입력">
        </div>
    </div>

    <div id="searchList">
        <div id="resCount" style="padding:10px 20px; font-size:13px; background:#f8f8f8; color:#888; border-bottom:1px solid #eee;"></div>
        <div id="listItems"></div>
    </div>

    <div id="resultView">
        <div class="result-card">
            <div class="word-header">
                <span id="v-word" class="word-title"></span>
                <span id="v-pron" class="word-pron"></span>
                <span id="v-pos" class="pos-badge"></span>
            </div>
            <div id="v-def" class="def-area"></div>
        </div>
    </div>

    <div class="rec-section">
        <div style="font-weight:bold; color:#666; margin-bottom:10px;">📅 오늘의 추천어</div>
        <div class="rec-container" id="recommendList"></div>
    </div>
</div>

<script>
    let dictData = [];
    let allWords = [];

    const posMap = { '󰃃': '명사', '󰂿': '동사', '󰃰': '형용사', '󰂴': '대명사', '󰃦': '부사', '󰃲': '관형사', '󰃳': '감탄사' };

    // 표제어 포맷팅 함수 (숫자는 윗첨자로, 괄호 한자는 작게)
    function formatWord(word) {
        if (!word) return "";
        let formatted = word;
        
        // 1. 괄호와 그 안의 내용(한자 등) 처리
        formatted = formatted.replace(/\((.*?)\)/g, '<span class="hanja">($1)</span>');
        
        // 2. 숫자를 찾아서 윗첨자로 (단, 태그 안의 숫자는 건드리지 않음)
        // 안전한 처리를 위해 괄호 밖의 숫자만 매칭
        formatted = formatted.replace(/(\d+)(?![^<]*>)/g, '<sup>$1</sup>');
        
        return formatted;
    }

    fetch('gyeongju_dict.json')
        .then(res => res.json())
        .then(data => {
            dictData = data;
            const words = new Set();
            data.forEach(item => {
                if(item.word) words.add(item.word);
                if(item.word_pure) words.add(item.word_pure);
            });
            allWords = Array.from(words).filter(w => w && w.length >= 2);
            allWords.sort((a, b) => b.length - a.length);
            
            document.getElementById('loadingOverlay').style.display = 'none';
            initRecommendations();
        });

    function linkify(text) {
        if (!text) return "";
        let cleaned = text.replace(/[가-힣]*'\s*\)?\s*">/g, '');
        
        let tokenized = cleaned;
        const foundWords = allWords.filter(w => cleaned.includes(w));
        const map = new Map();

        foundWords.forEach((word, index) => {
            const token = `###LINK${index}###`;
            if (tokenized.includes(word)) {
                tokenized = tokenized.split(word).join(token);
                map.set(token, word);
            }
        });

        map.forEach((originalWord, token) => {
            const displayWord = formatWord(originalWord);
            const linkHtml = `<span class="dict-link" onclick="handleLinkClick('${originalWord.replace(/\d+/g, '').replace(/\(.*\)/g, '')}')">${displayWord}</span>`;
            tokenized = tokenized.split(token).join(linkHtml);
        });

        return tokenized;
    }

    function displayDetail(item) {
        resultView.style.display = 'block';
        document.getElementById('v-word').innerHTML = formatWord(item.word);
        document.getElementById('v-pron').innerText = `[${item.pronunciation}]`;
        
        const posText = posMap[item.pos_symbol] || item.pos_symbol || "";
        const pBadge = document.getElementById('v-pos');
        pBadge.innerText = posText;
        pBadge.style.display = posText ? 'inline-block' : 'none';

        document.getElementById('v-def').innerHTML = linkify(item.definition);
        resultView.scrollIntoView({ behavior: 'smooth' });
    }

    function performSearch(type, query) {
        if (query.length < 1) return;
        let filtered = (type === 'dia') 
            ? dictData.filter(i => i.word_pure === query || i.word.includes(query))
            : dictData.filter(i => i.definition.includes(query));

        if (filtered.length === 1) {
            searchList.style.display = 'none';
            displayDetail(filtered[0]);
        } else if (filtered.length > 1) {
            displayList(filtered);
        }
    }

    function displayList(items) {
        searchList.style.display = 'block';
        resultView.style.display = 'none';
        document.getElementById('resCount').innerText = `결과 ${items.length}건`;
        const list = document.getElementById('listItems');
        list.innerHTML = '';
        items.slice(0, 50).forEach(item => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `<strong>${formatWord(item.word)}</strong> - ${item.definition.substring(0, 30)}...`;
            div.onclick = () => { displayDetail(item); searchList.style.display = 'none'; };
            list.appendChild(div);
        });
    }

    function handleLinkClick(word) {
        const pure = word.trim();
        document.getElementById('diaSearch').value = pure;
        performSearch('dia', pure);
    }

    function initRecommendations() {
        const container = document.getElementById('recommendList');
        const shuffled = [...dictData].sort(() => 0.5 - Math.random()).slice(0, 3);
        shuffled.forEach(item => {
            const div = document.createElement('div');
            div.className = 'rec-card';
            div.innerHTML = `<div style="color:var(--point); font-weight:bold;">${formatWord(item.word)}</div>
                             <div style="font-size:12px; color:#999;">${item.definition.substring(0,15)}...</div>`;
            div.onclick = () => displayDetail(item);
            container.appendChild(div);
        });
    }

    document.getElementById('diaSearch').addEventListener('input', (e) => performSearch('dia', e.target.value.trim()));
    document.getElementById('stdSearch').addEventListener('input', (e) => performSearch('std', e.target.value.trim()));
</script>

</body>
</html>
